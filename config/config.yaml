# Application settings
application_settings:
  database_url: "postgres://<USER>:<PASSWORD>@localhost:5432/<DATABASE>"
  threads: 1
  check_uniqueness_of_proxies: true

# Threading configuration
threads:
  registration: 1    # MUST BE 1 — rate limit protection
  farming: 200       # Async coroutines per process

# Multiprocess farming settings
multiprocess_farming:
  enabled: true                    # true = multiprocess mode, false = single process
  max_processes: 4                 # 0 = auto-detect (CPU count - 1)

# Farm settings
farm_settings:
  max_devices_per_batch: 1000
  max_concurrent_tasks: 400
  device_task_timeout: 60

# Device settings
device_settings:
  active_devices_per_account:
    min: 1
    max: 3

# Referral code settings
referral_code_settings:
  source: "db"  # "db" | "file" | "static"
  static_referral_code: ""

delay_before_start:
  min: 16
  max: 88

sleep_before_next_task:
  min: 120
  max: 160

retry:
  delay_seconds: 15
  max_registration_attempts: 5
  max_farm_attempts: 5
  proxy_rotation: true
  proxy_rotation_after_timeouts: 3

shuffle_accounts: true

# Optional: single catch-all mailbox for registration OTPs
redirect_settings:
  enable: false
  email: ""
  password: ""
  imap_server: "imap.gmail.com"

imap_settings:
  use_proxy_for_imap: false
  timeout: 30
  use_single_imap:
    enable: false
    imap_server: "imap.gmail.com"
  servers:
    gmail.com: imap.gmail.com
    yahoo.com: imap.mail.yahoo.com
    icloud.com: imap.mail.me.com
    mail.ru: imap.mail.ru
    gmx.com: imap.gmx.com
    gmx.net: imap.gmx.net
    gmx.de: imap.gmx.net
    onet.pl: imap.poczta.onet.pl
    onet.com.pl: imap.poczta.onet.pl
    op.pl: imap.poczta.onet.pl
    onet.eu: imap.poczta.onet.pl
    gazeta.pl: imap.gazeta.pl
    rambler.ru: imap.rambler.ru

logging:
  level: "INFO"  # DEBUG / INFO / WARNING / ERROR / CRITICAL
